<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Diet Budget Tracker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #0f172a);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-color: var(--tg-theme-text-color, #f8fafc);
      --accent-color: #10b981;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg-color); color: var(--text-color); padding: 16px; padding-bottom: 40px; min-height: 100vh; }
    
    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .circle-container { position: relative; width: 140px; height: 140px; margin: 0 auto 12px; }
    .circle-container svg { width: 140px; height: 140px; transform: rotate(-90deg); }
    .circle-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 10; }
    .circle-progress {
      fill: none;
      stroke: var(--accent-color);
      stroke-width: 10;
      stroke-dasharray: 408;
      stroke-dashoffset: 408;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.8s ease, stroke 0.3s ease;
    }

    .circle-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .circle-text .kcal { font-size: 24px; font-weight: 800; }
    .circle-text .label { font-size: 11px; opacity: 0.6; text-transform: uppercase; }

    .category-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      margin-bottom: 14px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .category-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .category-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; }
    .badge-active { background: rgba(16, 185, 129, 0.2); color: var(--accent-color); }
    .badge-complete { background: rgba(16, 185, 129, 0.3); color: #34d399; }
    .badge-over { background: rgba(239, 68, 68, 0.25); color: var(--danger-color); }

    .product-list { display: none; padding: 0 16px 16px; border-top: 1px solid rgba(255,255,255,0.05); }
    .category-card.open .product-list { display: block; }
    .category-card.completed { opacity: 0.65; }

    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .product-item:last-child { border-bottom: none; }
    .product-info .name { font-size: 14px; font-weight: 500; }
    .product-info .sub { font-size: 12px; opacity: 0.5; margin-top: 2px; }

    .add-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Modal Bottom Sheet */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: flex-end;
      flex-direction: column;
      z-index: 999;
    }
    .modal-content {
      background: #1e293b;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 24px;
      border-top: 1px solid var(--card-border);
    }
    .quick-btns { display: flex; gap: 8px; margin: 16px 0; }
    .quick-btn {
      flex: 1; padding: 10px; border-radius: 12px;
      background: rgba(255,255,255,0.08); border: 1px solid var(--card-border);
      color: #fff; font-weight: 600; cursor: pointer;
    }
    .grams-input {
      width: 100%; padding: 14px; border-radius: 14px;
      background: rgba(0,0,0,0.3); border: 1px solid var(--card-border);
      color: #fff; font-size: 18px; text-align: center; font-weight: 700;
      margin-bottom: 16px; outline: none;
    }
    .submit-btn {
      width: 100%; padding: 14px; border-radius: 14px;
      background: var(--accent-color); border: none;
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header-card">
    <div class="circle-container">
      <svg>
        <circle class="circle-bg" cx="70" cy="70" r="65"></circle>
        <circle class="circle-progress" id="progressRing" cx="70" cy="70" r="65"></circle>
      </svg>
      <div class="circle-text">
        <div class="kcal" id="consumedKcal">0</div>
        <div class="label" id="targetKcal">/ 2220 kcal</div>
      </div>
    </div>
    <div style="font-size: 13px; opacity: 0.7;" id="statusText">Добовий бюджет продуктів</div>
  </div>

  <div id="categoriesList"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <h3 id="modalTitle" style="margin-bottom: 4px;">Внести продукт</h3>
      <p id="modalSub" style="font-size: 13px; opacity: 0.6; margin-bottom: 12px;"></p>
      <input type="number" id="gramsInput" class="grams-input" placeholder="Введіть грами/шт">
      <div class="quick-btns">
        <button class="quick-btn" onclick="addQuick(5)">+5</button>
        <button class="quick-btn" onclick="addQuick(10)">+10</button>
        <button class="quick-btn" onclick="addQuick(50)">+50</button>
        <button class="quick-btn" onclick="fillRemaining()">З'їв усе</button>
      </div>
      <button class="submit-btn" onclick="submitGrams()">Підтвердити</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

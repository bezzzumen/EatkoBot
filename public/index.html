<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Eatko</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tg-bg: var(--tg-theme-bg-color, #0b0e14);
    --tg-text: var(--tg-theme-text-color, #f4f5f7);
    --tg-hint: var(--tg-theme-hint-color, #8b93a7);
    --tg-button: var(--tg-theme-button-color, #6366f1);
    --tg-button-text: var(--tg-theme-button-text-color, #ffffff);
    --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #11151f);

    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-bg-strong: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.14);

    --aurora-1: #6366f1;
    --aurora-2: #22d3ee;

    --protein-1: #10b981;
    --protein-2: #34d399;
    --fat-1: #f59e0b;
    --fat-2: #fbbf24;
    --carbs-1: #06b6d4;
    --carbs-2: #22d3ee;

    --success: #34d399;
    --success-glow: rgba(52, 211, 153, 0.45);
    --warning: #fbbf24;
    --warning-glow: rgba(251, 191, 36, 0.4);
    --danger: #ff453a;
    --danger-glow: rgba(255, 69, 58, 0.4);

    --radius-lg: 24px;
    --radius-md: 20px;
    --radius-sm: 14px;
    --radius-pill: 999px;

    --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.35);
    --shadow-sheet: 0 -20px 60px rgba(0, 0, 0, 0.5);
  }

  [data-theme="light"] {
    --glass-bg: rgba(0, 0, 0, 0.035);
    --glass-bg-strong: rgba(0, 0, 0, 0.055);
    --glass-border: rgba(0, 0, 0, 0.08);
    --glass-highlight: rgba(0, 0, 0, 0.1);
    --shadow-card: 0 8px 24px rgba(20, 20, 30, 0.08);
    --shadow-sheet: 0 -16px 40px rgba(20, 20, 30, 0.12);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, 'SF Pro Display', BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--tg-bg);
    color: var(--tg-text);
    padding-bottom: 40px;
    overscroll-behavior-y: contain;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace; }

  .glass {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
  }

  button { font-family: inherit; }

  /* ===== HEADER ===== */

  header { padding: 20px 16px 8px; }

  .top-row {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 14px;
  }
  .brand { display: flex; align-items: center; gap: 8px; text-align: center; }
  .brand .emoji { font-size: 20px; }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .date-pill { font-size: 11.5px; color: var(--tg-hint); font-weight: 500; }

  .streak-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 14px;
  }
  .streak-badge {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px; border-radius: var(--radius-pill);
    background: rgba(251, 146, 60, 0.14);
    border: 1px solid rgba(251, 146, 60, 0.4);
    box-shadow: 0 0 16px rgba(251, 146, 60, 0.35);
    animation: streak-pulse 2.4s ease-in-out infinite;
  }
  .streak-badge.zero {
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    box-shadow: none;
    animation: none;
  }
  @keyframes streak-pulse {
    0%, 100% { box-shadow: 0 0 16px rgba(251, 146, 60, 0.35); }
    50% { box-shadow: 0 0 24px rgba(251, 146, 60, 0.55); }
  }
  .streak-badge .flame { font-size: 15px; }
  .streak-badge .streak-text {
    font-size: 12px; font-weight: 800; letter-spacing: 0.02em;
    color: #fdba74;
  }
  .streak-badge.zero .streak-text { color: var(--tg-hint); }

  .analytics-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: var(--radius-pill);
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    color: var(--tg-text);
    font-size: 12px; font-weight: 700;
    cursor: pointer;
  }
  .analytics-btn:active { transform: scale(0.95); }

  .week-row {
    display: flex; justify-content: space-between; gap: 6px;
    padding: 4px 2px 2px;
  }
  .week-day {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .week-day .week-label { font-size: 10px; font-weight: 600; color: var(--tg-hint); text-transform: uppercase; letter-spacing: 0.03em; }
  .week-day .week-chip {
    width: 32px; height: 32px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
  }
  .week-day.status-success .week-chip { background: rgba(251,146,60,0.14); border-color: rgba(251,146,60,0.4); box-shadow: 0 0 10px rgba(251,146,60,0.3); }
  .week-day.status-over .week-chip { background: rgba(255,69,58,0.14); border-color: rgba(255,69,58,0.4); }
  .week-day.is-today .week-chip { border-width: 1.5px; border-color: var(--aurora-2); }
  .week-day.is-today .week-label { color: var(--tg-text); }


  .hero-card {
    padding: 22px 18px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    position: relative;
    overflow: hidden;
  }
  .hero-card::before {
    content: '';
    position: absolute;
    top: -60%; left: -20%;
    width: 140%; height: 140%;
    background: radial-gradient(circle at 30% 20%, rgba(99,102,241,0.16), transparent 55%),
                radial-gradient(circle at 75% 60%, rgba(34,211,238,0.12), transparent 55%);
    pointer-events: none;
  }

  .ring-wrap { position: relative; width: 176px; height: 176px; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: var(--glass-border); stroke-width: 12; }
  .ring-fill {
    fill: none;
    stroke: url(#ringGradient);
    stroke-width: 12;
    stroke-linecap: round;
    stroke-dasharray: 464.9;
    stroke-dashoffset: 464.9;
    transition: stroke-dashoffset 0.7s cubic-bezier(.2,.8,.2,1), stroke 0.3s ease;
    filter: drop-shadow(0 0 8px rgba(99,102,241,0.5));
  }
  .ring-fill.over { filter: drop-shadow(0 0 10px var(--danger-glow)); }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 2;
  }
  .ring-center .kcal-value { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
  .ring-center .kcal-target { font-size: 12px; color: var(--tg-hint); margin-top: 5px; font-weight: 500; }
  .ring-center .kcal-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; font-weight: 600; }

  .macros-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; z-index: 2; }
  .macro { display: flex; flex-direction: column; gap: 6px; }
  .macro .macro-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; }
  .macro .macro-name { color: var(--tg-hint); font-weight: 600; }
  .macro .macro-val { font-weight: 700; font-size: 11.5px; }
  .macro-track { height: 6px; border-radius: 4px; background: var(--glass-bg); overflow: hidden; }
  .macro-fill { height: 100%; border-radius: 4px; width: 0%; transition: width 0.6s cubic-bezier(.2,.8,.2,1); }
  .macro-fill.protein { background: linear-gradient(90deg, var(--protein-1), var(--protein-2)); box-shadow: 0 0 8px rgba(52,211,153,0.5); }
  .macro-fill.fat { background: linear-gradient(90deg, var(--fat-1), var(--fat-2)); box-shadow: 0 0 8px rgba(251,191,36,0.5); }
  .macro-fill.carbs { background: linear-gradient(90deg, var(--carbs-1), var(--carbs-2)); box-shadow: 0 0 8px rgba(34,211,238,0.5); }

  /* ===== CATEGORY CARDS ===== */

  main { padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px; }

  .cat-card { overflow: hidden; transition: opacity 0.3s ease; }
  .cat-card.status-complete { opacity: 0.7; }

  /* "Погане ЇДЛО" — standalone overdraft card: subtle red border + warm
     gradient wash to visually separate it from the 8 budgeted categories. */
  .junk-card {
    cursor: pointer;
    border: 1px solid rgba(255, 69, 58, 0.35);
    background:
      linear-gradient(135deg, rgba(255, 69, 58, 0.10), rgba(251, 191, 36, 0.07)),
      var(--glass-bg);
  }
  .junk-card:active { transform: scale(0.99); }
  .junk-card .cat-emoji { background: rgba(255, 69, 58, 0.14); border-color: rgba(255, 69, 58, 0.4); }
  .junk-pill {
    background: rgba(255, 69, 58, 0.16);
    border: 1px solid rgba(255, 69, 58, 0.45);
    color: var(--danger);
  }

  .cat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; cursor: pointer; user-select: none;
  }
  .cat-header .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .cat-header .cat-emoji {
    width: 40px; height: 40px; border-radius: 13px;
    background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center; font-size: 19px;
    flex-shrink: 0; position: relative;
  }
  .cat-card.status-complete .cat-emoji { background: rgba(52,211,153,0.14); border-color: rgba(52,211,153,0.35); }
  .cat-card.status-over .cat-emoji { background: rgba(255,69,58,0.14); border-color: rgba(255,69,58,0.4); }

  .cat-header .titles { min-width: 0; }
  .cat-header .titles h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .cat-header .titles .sub { font-size: 11.5px; color: var(--tg-hint); margin-top: 2px; font-weight: 500; }

  .cat-header .right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .status-pill {
    font-size: 11.5px; font-weight: 800; padding: 5px 10px; border-radius: var(--radius-pill);
    white-space: nowrap;
  }
  .status-pill.active { background: var(--glass-bg-strong); border: 1px solid var(--glass-border); color: var(--tg-text); }
  .status-pill.complete { background: rgba(52,211,153,0.16); border: 1px solid rgba(52,211,153,0.4); color: var(--success); box-shadow: 0 0 10px var(--success-glow); }
  .status-pill.over { background: rgba(255,69,58,0.16); border: 1px solid rgba(255,69,58,0.45); color: var(--danger); box-shadow: 0 0 10px var(--danger-glow); }

  .chevron { font-size: 11px; color: var(--tg-hint); transition: transform 0.3s cubic-bezier(.2,.8,.2,1); }
  .cat-card.open .chevron { transform: rotate(180deg); }

  .cat-progress { padding: 0 18px 14px; }
  .cat-progress-track { height: 7px; border-radius: 4px; background: var(--glass-bg); overflow: hidden; }
  .cat-progress-fill { height: 100%; border-radius: 4px; width: 0%; transition: width 0.6s cubic-bezier(.2,.8,.2,1); background: linear-gradient(90deg, var(--aurora-1), var(--aurora-2)); }
  .cat-progress-fill.complete { background: linear-gradient(90deg, var(--protein-1), var(--protein-2)); }
  .cat-progress-fill.over { background: linear-gradient(90deg, var(--danger), var(--warning)); }

  .cat-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s cubic-bezier(.2,.8,.2,1); }
  .cat-card.open .cat-body { grid-template-rows: 1fr; }
  .cat-body-inner { overflow: hidden; }

  .item-list { padding: 2px 10px 16px; display: flex; flex-direction: column; gap: 6px; }

  .item-row {
    display: flex; align-items: center; gap: 12px; padding: 11px 8px;
    border-radius: var(--radius-sm); cursor: pointer;
    transition: background 0.2s ease;
  }
  .item-row:active { background: var(--glass-bg); }
  .item-row .info { flex: 1; min-width: 0; }
  .item-row .name { font-size: 13.5px; font-weight: 600; }
  .item-row .max-tag { font-size: 11px; color: var(--tg-hint); font-weight: 500; margin-left: 6px; }
  .item-row .item-progress-track {
    height: 5px; border-radius: 3px; background: var(--glass-bg-strong); overflow: hidden; margin-top: 6px;
  }
  .item-row .item-progress-fill {
    height: 100%; border-radius: 3px; width: 0%; transition: width 0.5s cubic-bezier(.2,.8,.2,1);
    background: linear-gradient(90deg, var(--aurora-1), var(--aurora-2));
  }
  .item-row .item-progress-fill.over { background: linear-gradient(90deg, var(--danger), var(--warning)); }
  .item-row .logged-text { font-size: 10.5px; color: var(--tg-hint); margin-top: 3px; font-weight: 500; }
  .item-row .chev { color: var(--tg-hint); font-size: 13px; flex-shrink: 0; }

  .empty-note { color: var(--tg-hint); font-size: 12.5px; padding: 10px 8px; }

  /* ===== BOTTOM SHEET ===== */

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: flex-end; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .sheet {
    width: 100%; max-height: 86vh;
    background: var(--tg-secondary-bg);
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border); border-bottom: none;
    border-radius: 26px 26px 0 0; box-shadow: var(--shadow-sheet);
    padding: 8px 0 max(18px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(.16,1,.3,1);
  }
  .overlay.show .sheet { transform: translateY(0); animation: sheet-settle 0.35s cubic-bezier(.16,1,.3,1); }
  @keyframes sheet-settle { from { transform: translateY(6%); } to { transform: translateY(0); } }

  .sheet-handle { width: 38px; height: 4px; border-radius: 2px; background: var(--glass-highlight); margin: 8px auto 12px; }

  .sheet-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 0 18px 14px; }
  .sheet-header .titlewrap { display: flex; align-items: center; gap: 10px; }
  .sheet-header .sheet-emoji {
    width: 36px; height: 36px; border-radius: 11px;
    background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .sheet-header h2 { margin: 0; font-size: 16.5px; font-weight: 700; }
  .sheet-header .sub { color: var(--tg-hint); font-size: 12px; margin-top: 2px; font-weight: 500; }
  .sheet-close {
    background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
    width: 30px; height: 30px; border-radius: 50%; color: var(--tg-hint); font-size: 14px; cursor: pointer; flex-shrink: 0;
  }
  .sheet-close:active { transform: scale(0.9); }

  .sheet-scroll { overflow-y: auto; padding: 0 18px; -webkit-overflow-scrolling: touch; }

  .current-logged {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; border-radius: var(--radius-sm);
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    margin-bottom: 16px;
  }
  .current-logged .label { font-size: 12.5px; color: var(--tg-hint); font-weight: 600; }
  .current-logged .value { font-size: 17px; font-weight: 700; }
  .current-logged .value.over { color: var(--danger); }
  .current-logged .value.complete { color: var(--success); }

  .remaining-hint {
    font-size: 12px;
    color: var(--tg-hint);
    font-weight: 500;
    text-align: center;
    padding: 0 4px 14px;
    line-height: 1.4;
  }
  .remaining-hint b { color: var(--tg-text); font-weight: 700; }

  .quick-add-label { font-size: 12px; color: var(--tg-hint); font-weight: 600; margin-bottom: 8px; }
  .quick-add-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .quick-add-row button {
    padding: 12px 0; border-radius: 13px; border: 1px solid var(--glass-border);
    background: var(--glass-bg); color: var(--tg-text); font-size: 13px; font-weight: 700; cursor: pointer;
    transition: all 0.15s ease;
  }
  .quick-add-row button.selected {
    border-color: transparent;
    background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2));
    color: #fff;
    box-shadow: 0 4px 14px rgba(99,102,241,0.35);
  }
  .fill-remaining-btn {
    width: 100%; padding: 12px 0; margin-bottom: 16px;
    border-radius: 13px; border: 1px dashed var(--glass-border);
    background: none; color: var(--tg-hint); font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .fill-remaining-btn.selected {
    border-style: solid; border-color: transparent;
    background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2)); color: #fff;
  }

  .custom-input-wrap { margin-bottom: 16px; }
  .custom-input-label { font-size: 12px; color: var(--tg-hint); font-weight: 600; margin-bottom: 8px; }
  .custom-input-row { display: flex; gap: 8px; }
  .custom-input-row input {
    flex: 1; padding: 12px 14px; border-radius: 13px; border: 1px solid var(--glass-border);
    background: var(--glass-bg); color: var(--tg-text); font-size: 15px; font-weight: 600;
    font-family: 'IBM Plex Mono', monospace;
  }
  .custom-input-row input:focus { outline: none; border-color: var(--aurora-1); }
  .custom-input-row .unit-label { display: flex; align-items: center; padding: 0 12px; color: var(--tg-hint); font-size: 13px; font-weight: 600; }

  .preview-line { text-align: center; font-size: 12.5px; color: var(--tg-hint); padding-bottom: 6px; font-weight: 500; }
  .preview-line b { color: var(--tg-text); }

  .sheet-footer { padding: 12px 18px 4px; }
  .confirm-btn {
    width: 100%; padding: 15px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2)); color: #fff;
    font-size: 15px; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 24px rgba(99,102,241,0.35);
    transition: transform 0.15s ease;
  }
  .confirm-btn:active { transform: scale(0.97); }
  .confirm-btn:disabled { opacity: 0.35; box-shadow: none; }

  #toast {
    position: fixed; bottom: 18px; left: 16px; right: 16px;
    background: var(--glass-bg-strong);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border); color: var(--tg-text);
    padding: 12px 16px; border-radius: 16px; text-align: center; font-size: 13px; font-weight: 600;
    opacity: 0; transform: translateY(10px); pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease; z-index: 200;
    box-shadow: var(--shadow-card);
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  /* ===== LOCK SCREEN ===== */

  .lock-screen {
    position: fixed; inset: 0; z-index: 300;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: var(--tg-bg);
  }
  .lock-screen.hidden { display: none; }
  .lock-card {
    width: 100%; max-width: 340px;
    padding: 32px 24px;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }
  .lock-logo {
    font-size: 40px;
    width: 76px; height: 76px;
    border-radius: 22px;
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
  }
  .lock-title { margin: 0 0 10px; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
  .lock-message { margin: 0 0 22px; font-size: 13.5px; color: var(--tg-hint); line-height: 1.5; }
  .lock-input {
    width: 100%; padding: 14px 16px; margin-bottom: 10px;
    border-radius: 14px; border: 1px solid var(--glass-border);
    background: var(--glass-bg); color: var(--tg-text);
    font-size: 16px; font-weight: 700; text-align: center; letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: 'IBM Plex Mono', monospace;
  }
  .lock-input:focus { outline: none; border-color: var(--aurora-1); }
  .lock-error {
    min-height: 18px; font-size: 12px; font-weight: 600; color: var(--danger);
    margin-bottom: 12px;
  }
  .lock-submit-btn {
    width: 100%; padding: 15px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2)); color: #fff;
    font-size: 15px; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 24px rgba(99,102,241,0.35);
  }
  .lock-submit-btn:active { transform: scale(0.97); }
  .lock-submit-btn:disabled { opacity: 0.5; }

  /* ===== ANALYTICS MODAL ===== */

  .analytics-sheet { max-height: 88vh; }

  .chart-area { position: relative; padding: 10px 4px 4px; }
  .chart-baseline {
    position: absolute; left: 4px; right: 4px;
    border-top: 2px dashed rgba(255,255,255,0.3);
    z-index: 2;
  }
  .chart-baseline::after {
    content: 'Ціль';
    position: absolute; right: 0; top: -16px;
    font-size: 9.5px; font-weight: 700; color: var(--tg-hint);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .chart-bars {
    display: flex; align-items: flex-end; gap: 3px;
    height: 160px; position: relative; z-index: 1;
  }
  .chart-bar-col {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    height: 100%;
    cursor: pointer;
  }
  .chart-bar-track {
    width: 100%; flex: 1;
    display: flex; align-items: flex-end;
    border-radius: 4px;
    overflow: hidden;
    background: var(--glass-bg);
  }
  .chart-bar-fill {
    width: 100%; border-radius: 4px 4px 0 0;
    transition: height 0.4s cubic-bezier(.2,.8,.2,1), opacity 0.2s ease;
    min-height: 2px;
  }
  .chart-bar-fill.success { background: linear-gradient(180deg, var(--aurora-2), var(--aurora-1)); }
  .chart-bar-fill.over { background: linear-gradient(180deg, var(--warning), var(--danger)); }
  .chart-bar-fill.empty { background: var(--glass-bg-strong); }
  .chart-bar-fill.future { background: transparent; }
  .chart-bar-col.selected .chart-bar-track { box-shadow: 0 0 0 2px var(--aurora-2) inset; border-radius: 4px; }
  .chart-bar-label {
    font-size: 8.5px; font-weight: 700; color: var(--tg-hint);
    text-transform: uppercase;
  }

  .day-detail-card {
    margin-top: 18px; padding: 16px;
  }
  .day-detail-date { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .day-detail-kcal { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 700; margin-bottom: 14px; }
  .day-detail-kcal.over { color: var(--danger); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
</svg>

<div class="lock-screen hidden" id="lockScreen">
  <div class="lock-card glass">
    <div class="lock-logo">🍽️</div>
    <h1 class="lock-title">Eatko</h1>
    <p class="lock-message">Цей застосунок доступний лише за запрошенням. Введіть код, який вам надіслали.</p>
    <input type="text" class="lock-input" id="inviteCodeInput" placeholder="Код запрошення" maxlength="16" autocomplete="off" autocapitalize="characters" />
    <div class="lock-error" id="inviteError"></div>
    <button class="lock-submit-btn" id="inviteSubmitBtn">Увійти</button>
  </div>
</div>

<header>
  <div class="top-row">
    <div class="brand">
      <span class="emoji">🍽️</span>
      <div>
        <h1>Eatko</h1>
        <div class="date-pill" id="dateLabel"></div>
      </div>
    </div>
  </div>

  <div class="streak-row">
    <div class="streak-badge" id="streakBadge">
      <span class="flame">🔥</span>
      <span class="streak-text" id="streakText">0 ДНІВ ПОСПІЛЬ</span>
    </div>
    <button class="analytics-btn" id="analyticsBtn">📊 Статистика</button>
  </div>

  <div class="hero-card glass">
    <div class="ring-wrap">
      <svg viewBox="0 0 176 176">
        <circle class="ring-track" cx="88" cy="88" r="74" />
        <circle class="ring-fill" id="ringFill" cx="88" cy="88" r="74" />
      </svg>
      <div class="ring-center">
        <div class="kcal-value mono" id="kcalValue">0</div>
        <div class="kcal-target mono" id="kcalTarget">/ 0 ккал</div>
        <div class="kcal-label" id="kcalStatusLabel">залишок</div>
      </div>
    </div>

    <div class="macros-row">
      <div class="macro">
        <div class="macro-top"><span class="macro-name">🍗 Білки</span><span class="macro-val mono" id="proteinVal">0/0г</span></div>
        <div class="macro-track"><div class="macro-fill protein" id="proteinFill"></div></div>
      </div>
      <div class="macro">
        <div class="macro-top"><span class="macro-name">🥑 Жири</span><span class="macro-val mono" id="fatVal">0/0г</span></div>
        <div class="macro-track"><div class="macro-fill fat" id="fatFill"></div></div>
      </div>
      <div class="macro">
        <div class="macro-top"><span class="macro-name">🌾 Вуглеводи</span><span class="macro-val mono" id="carbsVal">0/0г</span></div>
        <div class="macro-track"><div class="macro-fill carbs" id="carbsFill"></div></div>
      </div>
    </div>

    <div class="week-row" id="weekRow"></div>
  </div>
</header>

<main id="categoriesContainer"></main>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="titlewrap">
        <div class="sheet-emoji" id="sheetEmoji">🍽️</div>
        <div>
          <h2 id="sheetTitle">Product</h2>
          <div class="sub" id="sheetSub"></div>
        </div>
      </div>
      <button class="sheet-close" id="sheetClose">✕</button>
    </div>
    <div id="sheetContent"></div>
  </div>
</div>

<div class="overlay" id="analyticsOverlay">
  <div class="sheet analytics-sheet" id="analyticsSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="titlewrap">
        <div class="sheet-emoji">📊</div>
        <div>
          <h2>Статистика</h2>
          <div class="sub" id="analyticsSub"></div>
        </div>
      </div>
      <button class="sheet-close" id="analyticsClose">✕</button>
    </div>

    <div class="mode-toggle" id="analyticsPeriodToggle">
      <button data-period="week" class="active">Поточний тиждень</button>
      <button data-period="month">Поточний місяць</button>
    </div>

    <div class="sheet-scroll">
      <div id="analyticsChart"></div>
      <div id="analyticsDayDetail"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Diet Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================================
     TOKENS
     Adaptive: base surfaces come from Telegram's own CSS vars (so the app
     always matches the user's actual theme), layered with a fixed dark
     glassmorphism system. [data-theme="light"] softens the glass so it still
     reads correctly against a light Telegram theme.
     ========================================================================= */
  :root {
    --tg-bg: var(--tg-theme-bg-color, #0b0e14);
    --tg-text: var(--tg-theme-text-color, #f4f5f7);
    --tg-hint: var(--tg-theme-hint-color, #8b93a7);
    --tg-button: var(--tg-theme-button-color, #6366f1);
    --tg-button-text: var(--tg-theme-button-text-color, #ffffff);
    --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #11151f);

    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-bg-strong: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.14);

    /* Signature hero gradient — the calorie ring */
    --aurora-1: #6366f1;
    --aurora-2: #22d3ee;

    /* Macro accents (fixed — theme independent, per spec) */
    --protein-1: #10b981;
    --protein-2: #34d399;
    --fat-1: #f59e0b;
    --fat-2: #fbbf24;
    --carbs-1: #06b6d4;
    --carbs-2: #22d3ee;

    --success: #34d399;
    --success-glow: rgba(52, 211, 153, 0.45);
    --danger: #ff453a;
    --warning: #fbbf24;

    --radius-lg: 24px;
    --radius-md: 20px;
    --radius-sm: 14px;
    --radius-pill: 999px;

    --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.35);
    --shadow-sheet: 0 -20px 60px rgba(0, 0, 0, 0.5);
  }

  [data-theme="light"] {
    --glass-bg: rgba(0, 0, 0, 0.035);
    --glass-bg-strong: rgba(0, 0, 0, 0.055);
    --glass-border: rgba(0, 0, 0, 0.08);
    --glass-highlight: rgba(0, 0, 0, 0.1);
    --shadow-card: 0 8px 24px rgba(20, 20, 30, 0.08);
    --shadow-sheet: 0 -16px 40px rgba(20, 20, 30, 0.12);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, 'SF Pro Display', BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--tg-bg);
    color: var(--tg-text);
    padding-bottom: 40px;
    overscroll-behavior-y: contain;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace; }

  .glass {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
  }

  button { font-family: inherit; }

  /* ========================================================================= HEADER ========================================================================= */

  header { padding: 20px 16px 8px; }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .emoji { font-size: 20px; }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .date-pill {
    font-size: 11.5px;
    color: var(--tg-hint);
    font-weight: 500;
  }
  .reset-btn {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: var(--tg-hint);
    font-size: 11.5px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: var(--radius-pill);
    cursor: pointer;
  }
  .reset-btn:active { transform: scale(0.94); }

  /* --- Hero card: ring + macros --- */

  .hero-card {
    padding: 22px 18px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    position: relative;
    overflow: hidden;
  }
  .hero-card::before {
    content: '';
    position: absolute;
    top: -60%; left: -20%;
    width: 140%; height: 140%;
    background: radial-gradient(circle at 30% 20%, rgba(99,102,241,0.16), transparent 55%),
                radial-gradient(circle at 75% 60%, rgba(34,211,238,0.12), transparent 55%);
    pointer-events: none;
  }

  .ring-wrap {
    position: relative;
    width: 176px;
    height: 176px;
  }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: var(--glass-border); stroke-width: 12; }
  .ring-fill {
    fill: none;
    stroke: url(#ringGradient);
    stroke-width: 12;
    stroke-linecap: round;
    stroke-dasharray: 464.9;
    stroke-dashoffset: 464.9;
    transition: stroke-dashoffset 0.7s cubic-bezier(.2,.8,.2,1);
    filter: drop-shadow(0 0 8px rgba(99,102,241,0.5));
  }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .ring-center .kcal-value {
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .ring-center .kcal-target {
    font-size: 12px;
    color: var(--tg-hint);
    margin-top: 5px;
    font-weight: 500;
  }
  .ring-center .kcal-label {
    font-size: 10.5px;
    color: var(--tg-hint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 2px;
    font-weight: 600;
  }

  .macros-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    z-index: 2;
  }
  .macro {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .macro .macro-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11px;
  }
  .macro .macro-name { color: var(--tg-hint); font-weight: 600; }
  .macro .macro-val { font-weight: 700; font-size: 11.5px; }
  .macro-track {
    height: 6px;
    border-radius: 4px;
    background: var(--glass-bg);
    overflow: hidden;
  }
  .macro-fill {
    height: 100%;
    border-radius: 4px;
    width: 0%;
    transition: width 0.6s cubic-bezier(.2,.8,.2,1);
  }
  .macro-fill.protein { background: linear-gradient(90deg, var(--protein-1), var(--protein-2)); box-shadow: 0 0 8px rgba(52,211,153,0.5); }
  .macro-fill.fat { background: linear-gradient(90deg, var(--fat-1), var(--fat-2)); box-shadow: 0 0 8px rgba(251,191,36,0.5); }
  .macro-fill.carbs { background: linear-gradient(90deg, var(--carbs-1), var(--carbs-2)); box-shadow: 0 0 8px rgba(34,211,238,0.5); }

  /* ========================================================================= MEALS ========================================================================= */

  main { padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px; }

  .meal-card { overflow: hidden; }

  .meal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    cursor: pointer;
    user-select: none;
  }
  .meal-header .left { display: flex; align-items: center; gap: 12px; }
  .meal-header .meal-emoji {
    width: 40px; height: 40px;
    border-radius: 13px;
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
  }
  .meal-header .titles h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .meal-header .titles .sub { font-size: 11.5px; color: var(--tg-hint); margin-top: 2px; font-weight: 500; }
  .meal-header .right { display: flex; align-items: center; gap: 10px; }
  .meal-header .kcal-badge {
    font-size: 12px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: var(--radius-pill);
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
  }
  .meal-header .chevron {
    font-size: 11px;
    color: var(--tg-hint);
    transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
  }
  .meal-card.open .chevron { transform: rotate(180deg); }

  .meal-body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.35s cubic-bezier(.2,.8,.2,1);
  }
  .meal-card.open .meal-body { grid-template-rows: 1fr; }
  .meal-body-inner { overflow: hidden; }

  .cat-list { padding: 2px 10px 12px; display: flex; flex-direction: column; gap: 6px; }

  .cat-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: opacity 0.35s ease, background 0.2s ease;
  }
  .cat-row:active { background: var(--glass-bg); }
  .cat-row .icon {
    width: 38px; height: 38px;
    border-radius: 12px;
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .cat-row .info { flex: 1; min-width: 0; }
  .cat-row .name {
    font-size: 14px;
    font-weight: 600;
    position: relative;
    display: inline-block;
  }
  .cat-row .name .strike-line {
    position: absolute;
    left: 0; top: 50%;
    height: 1.5px;
    width: 0%;
    background: var(--tg-hint);
    transform: translateY(-50%);
  }
  .cat-row.state-complete .name .strike-line {
    animation: strike-grow 0.4s cubic-bezier(.3,.8,.3,1) forwards;
  }
  @keyframes strike-grow { to { width: 100%; } }

  .cat-row .subname {
    font-size: 11.5px;
    color: var(--tg-hint);
    margin-top: 2px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cat-row.state-complete { opacity: 0.55; }
  .cat-row.state-complete .icon {
    background: rgba(52, 211, 153, 0.12);
    border-color: rgba(52, 211, 153, 0.3);
  }

  .cat-row .control { flex-shrink: 0; }
  .add-pill {
    display: flex; align-items: center; gap: 4px;
    padding: 7px 12px;
    border-radius: var(--radius-pill);
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    font-size: 12px;
    font-weight: 700;
    color: var(--tg-text);
  }
  .fifty-pill {
    padding: 6px 11px;
    border-radius: var(--radius-pill);
    background: rgba(251, 191, 36, 0.14);
    border: 1px solid rgba(251, 191, 36, 0.4);
    color: var(--fat-2);
    font-size: 11.5px;
    font-weight: 800;
  }
  .check-badge {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    background: rgba(52, 211, 153, 0.14);
    box-shadow: 0 0 0 rgba(52,211,153,0);
  }
  .cat-row.animate-check .check-badge {
    animation: check-pop 0.45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes check-pop {
    0% { transform: scale(0.4); box-shadow: 0 0 0 rgba(52,211,153,0); }
    55% { transform: scale(1.25); box-shadow: 0 0 18px var(--success-glow); }
    100% { transform: scale(1); box-shadow: 0 0 10px var(--success-glow); }
  }
  .cat-row.animate-check .icon { animation: icon-bounce 0.4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes icon-bounce { 0% { transform: scale(1); } 45% { transform: scale(1.18); } 100% { transform: scale(1); } }

  .empty-note { color: var(--tg-hint); font-size: 12.5px; padding: 10px 8px; }

  /* ========================================================================= BOTTOM SHEET ========================================================================= */

  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: flex-end;
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .sheet {
    width: 100%;
    max-height: 86vh;
    background: color-mix(in srgb, var(--tg-bg) 88%, black 4%);
    background: var(--tg-secondary-bg);
    -webkit-backdrop-filter: blur(24px);
    backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    border-bottom: none;
    border-radius: 26px 26px 0 0;
    box-shadow: var(--shadow-sheet);
    padding: 8px 0 max(18px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(.16,1,.3,1);
  }
  .overlay.show .sheet { transform: translateY(0); animation: sheet-settle 0.35s cubic-bezier(.16,1,.3,1); }
  @keyframes sheet-settle { from { transform: translateY(6%); } to { transform: translateY(0); } }

  .sheet-handle {
    width: 38px; height: 4px;
    border-radius: 2px;
    background: var(--glass-highlight);
    margin: 8px auto 12px;
  }

  .sheet-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 0 18px 12px;
  }
  .sheet-header .titlewrap { display: flex; align-items: center; gap: 10px; }
  .sheet-header .sheet-emoji {
    width: 36px; height: 36px;
    border-radius: 11px;
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
  }
  .sheet-header h2 { margin: 0; font-size: 16.5px; font-weight: 700; }
  .sheet-header .sub { color: var(--tg-hint); font-size: 12px; margin-top: 2px; font-weight: 500; }
  .sheet-close {
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    width: 30px; height: 30px;
    border-radius: 50%;
    color: var(--tg-hint);
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .sheet-close:active { transform: scale(0.9); }

  .mode-toggle {
    display: flex;
    margin: 0 18px 14px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 13px;
    padding: 4px;
  }
  .mode-toggle button {
    flex: 1;
    border: none;
    background: none;
    padding: 9px 0;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--tg-hint);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .mode-toggle button.active {
    background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2));
    color: #fff;
    box-shadow: 0 4px 14px rgba(99,102,241,0.35);
  }

  .sheet-scroll { overflow-y: auto; padding: 0 18px; -webkit-overflow-scrolling: touch; }

  .product-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 13px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    margin-bottom: 8px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .product-row:active { transform: scale(0.98); }
  .product-row.selected {
    border-color: transparent;
    background: linear-gradient(var(--tg-secondary-bg), var(--tg-secondary-bg)) padding-box,
                linear-gradient(135deg, var(--aurora-1), var(--aurora-2)) border-box;
    border: 1.5px solid transparent;
  }
  .product-row.disabled { opacity: 0.35; pointer-events: none; }
  .product-row .name { font-size: 14px; font-weight: 600; }
  .product-row .name .tag {
    display: inline-block; margin-left: 6px;
    font-size: 10px; font-weight: 800;
    color: var(--fat-2);
    border: 1px solid rgba(251,191,36,0.5);
    border-radius: 6px;
    padding: 2px 5px;
    vertical-align: middle;
  }
  .product-row .cal { font-size: 11.5px; color: var(--tg-hint); white-space: nowrap; font-weight: 600; }
  .product-row .radio {
    width: 19px; height: 19px;
    border-radius: 50%;
    border: 1.5px solid var(--glass-border);
    flex-shrink: 0;
    position: relative;
  }
  .product-row.selected .radio {
    border-color: transparent;
    background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2));
  }
  .product-row.selected .radio::after {
    content: '✓';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #fff; font-weight: 800;
  }

  .portion-toggle { display: flex; gap: 8px; padding: 4px 0 14px; }
  .portion-toggle button {
    flex: 1;
    padding: 11px 0;
    border-radius: 13px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    font-size: 13px;
    font-weight: 700;
    color: var(--tg-text);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .portion-toggle button.active {
    border-color: transparent;
    background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2));
    color: #fff;
    box-shadow: 0 4px 14px rgba(99,102,241,0.35);
  }
  .portion-toggle button:disabled { opacity: 0.3; pointer-events: none; }

  .swap-note {
    padding: 0 0 12px; color: var(--tg-hint); font-size: 12px; text-align: center; line-height: 1.5;
  }

  .sheet-footer { padding: 12px 18px 4px; }
  .confirm-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2));
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(99,102,241,0.35);
    transition: transform 0.15s ease;
  }
  .confirm-btn:active { transform: scale(0.97); }
  .confirm-btn:disabled { opacity: 0.35; box-shadow: none; }

  .entry-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    margin-bottom: 8px;
  }
  .entry-row .name { font-size: 13.5px; font-weight: 600; }
  .entry-row .meta { color: var(--tg-hint); font-size: 11.5px; margin-top: 3px; font-weight: 500; }
  .entry-row .del {
    background: rgba(255,69,58,0.12);
    border: 1px solid rgba(255,69,58,0.3);
    color: var(--danger);
    width: 30px; height: 30px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .entry-row .del:active { transform: scale(0.9); }

  .move-label { color: var(--tg-hint); font-size: 12px; margin: 12px 0 8px; font-weight: 600; }
  .move-row { display: flex; gap: 8px; padding-bottom: 8px; }
  .move-row button {
    flex: 1;
    padding: 10px 0;
    border-radius: 12px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    color: var(--tg-text);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .move-row button:disabled { opacity: 0.3; }
  .move-row button:not(:disabled):active { transform: scale(0.95); }

  #toast {
    position: fixed;
    bottom: 18px; left: 16px; right: 16px;
    background: var(--glass-bg-strong);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    color: var(--tg-text);
    padding: 12px 16px;
    border-radius: 16px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 200;
    box-shadow: var(--shadow-card);
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
</svg>

<header>
  <div class="top-row">
    <div class="brand">
      <span class="emoji">🍽️</span>
      <div>
        <h1>Diet Tracker</h1>
        <div class="date-pill" id="dateLabel"></div>
      </div>
    </div>
    <button class="reset-btn" id="resetBtn">↺ Reset day</button>
  </div>

  <div class="hero-card glass">
    <div class="ring-wrap">
      <svg viewBox="0 0 176 176">
        <circle class="ring-track" cx="88" cy="88" r="74" />
        <circle class="ring-fill" id="ringFill" cx="88" cy="88" r="74" />
      </svg>
      <div class="ring-center">
        <div class="kcal-value mono" id="kcalValue">0</div>
        <div class="kcal-target mono" id="kcalTarget">/ 0 kcal</div>
        <div class="kcal-label" id="kcalStatusLabel">on track</div>
      </div>
    </div>

    <div class="macros-row">
      <div class="macro">
        <div class="macro-top"><span class="macro-name">🍗 Protein</span><span class="macro-val mono" id="proteinVal">0/0g</span></div>
        <div class="macro-track"><div class="macro-fill protein" id="proteinFill"></div></div>
      </div>
      <div class="macro">
        <div class="macro-top"><span class="macro-name">🥑 Fat</span><span class="macro-val mono" id="fatVal">0/0g</span></div>
        <div class="macro-track"><div class="macro-fill fat" id="fatFill"></div></div>
      </div>
      <div class="macro">
        <div class="macro-top"><span class="macro-name">🌾 Carbs</span><span class="macro-val mono" id="carbsVal">0/0g</span></div>
        <div class="macro-track"><div class="macro-fill carbs" id="carbsFill"></div></div>
      </div>
    </div>
  </div>
</header>

<main id="mealsContainer"></main>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="titlewrap">
        <div class="sheet-emoji" id="sheetEmoji">🍽️</div>
        <div>
          <h2 id="sheetTitle">Category</h2>
          <div class="sub" id="sheetSub"></div>
        </div>
      </div>
      <button class="sheet-close" id="sheetClose">✕</button>
    </div>
    <div id="sheetContent"></div>
  </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
